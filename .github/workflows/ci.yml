name: CI Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          MONGO_URI: mongodb://localhost:27017/test_db
          JWT_SECRET: test-secret-key-for-ci

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        if: always()

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t cloud-native-task-manager:latest .

      - name: Run container smoke test
        run: |
          docker run -d --name app_test \
            -e MONGO_URI=mongodb://host.docker.internal:27017/test \
            -e JWT_SECRET=test-secret \
            -p 3000:3000 \
            cloud-native-task-manager:latest
          sleep 5
          curl --fail http://localhost:3000/api/health || exit 1